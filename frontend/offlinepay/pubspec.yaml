name: offlinepay
description: OfflinePay QR payment application
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # API / Backend
  http: ^1.2.2

  # Digital signatures
  cryptography: ^2.9.0

  # Secure private-key storage
  flutter_secure_storage: ^11.2.0

  # Local storage
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
  path: ^1.9.0

  # QR generation and scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2

  # IDs
  uuid: ^4.5.1

  # Network status
  connectivity_plus: ^6.1.1

  # Detect Android device model
  device_info_plus: ^13.3.0

  # Payment success sound
  audioplayers: ^6.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/payment_success.mp3
